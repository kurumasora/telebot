<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おごりおごられ台帳</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="/">台帳</a>
        <a href="/settings.html">設定</a>
    </nav>

    <h1>おごりおごられ台帳</h1>

    <section id="form-section">
        <h2>新規追加</h2>
        <input id="lender" placeholder="貸した人" />
        <input id="borrower" placeholder="借りた人" />
        <input id="amount" type="number" placeholder="金額" />
        <input id="memo" placeholder="メモ（はま代など）" />
        <button onclick="addRecord()">追加</button>
    </section>

    <section id="list-section">
        <h2>台帳一覧</h2>
        <table id="ledger-table">
            <thead>
                <tr>
                    <th>貸した人</th>
                    <th>借りた人</th>
                    <th>金額</th>
                    <th>メモ</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="ledger-body">
            </tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
