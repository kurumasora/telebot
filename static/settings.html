<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>設定</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="/">台帳</a>
        <a href="/settings.html">設定</a>
    </nav>

    <h1>設定</h1>

    <section>
        <h2>リマインド時刻</h2>
        <p>毎日この時刻に未払いの台帳をTelegramへ送信します（JST）</p>
        <input id="remind_time" type="time" />
        <button onclick="saveSetting()">保存</button>
        <p id="message"></p>
    </section>

    <section>
        <h2>リマインド停止</h2>
        <p id="remind-status">状態を確認中...</p>
        <button id="remind-toggle-btn" onclick="toggleRemind()"></button>
    </section>

    <section>
        <h2>テスト送信</h2>
        <p>今の未払いリストを自分だけに送信します</p>
        <button onclick="sendTest()">今すぐ送信</button>
        <p id="test-message"></p>
    </section>

    <script>
        let remindEnabled = true;

        window.onload = async () => {
            const res = await fetch("/settings/remind_time");
            const data = await res.json();
            if (data.value) {
                document.getElementById("remind_time").value = data.value;
            }

            const enabledRes = await fetch("/settings/remind_enabled");
            const enabledData = await enabledRes.json();
            remindEnabled = enabledData.value !== "false";
            renderRemindStatus();
        };

        function renderRemindStatus() {
            document.getElementById("remind-status").textContent =
                remindEnabled ? "リマインドは有効です" : "リマインドは停止中です";
            document.getElementById("remind-toggle-btn").textContent =
                remindEnabled ? "リマインドを停止する" : "リマインドを再開する";
        }

        async function toggleRemind() {
            remindEnabled = !remindEnabled;
            await fetch("/settings/remind_enabled", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ value: remindEnabled ? "true" : "false" }),
            });
            renderRemindStatus();
        }

        async function sendTest() {
            const res = await fetch("/send-test", { method: "POST" });
            const data = await res.json();
            document.getElementById("test-message").textContent = data.message;
        }

        async function saveSetting() {
            const value = document.getElementById("remind_time").value;
            await fetch("/settings/remind_time", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ value }),
            });
            document.getElementById("message").textContent = "保存しました";
        }
    </script>
</body>
</html>
